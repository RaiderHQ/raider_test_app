name: Build iOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          bundle install
          bundle exec pod install

      - name: Build iOS Simulator App
        run: |
          xcodebuild \
            -workspace ios/RaiderTestApp.xcworkspace \
            -scheme RaiderTestApp \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r RaiderTestApp.app.zip RaiderTestApp.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: raider-test-app-ios
          path: build/Build/Products/Release-iphonesimulator/RaiderTestApp.app.zip
