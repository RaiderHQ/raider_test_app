name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             raider-test-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raider-test-app-android
          path: raider-test-app.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          bundle install
          bundle exec pod install

      - name: Build iOS Simulator App
        run: |
          xcodebuild \
            -workspace ios/RaiderTestApp.xcworkspace \
            -scheme RaiderTestApp \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r /tmp/raider-test-app-ios.zip RaiderTestApp.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: raider-test-app-ios
          path: /tmp/raider-test-app-ios.zip

  release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: raider-test-app-android
          path: artifacts

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: raider-test-app-ios
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/raider-test-app.apk
            artifacts/raider-test-app-ios.zip
